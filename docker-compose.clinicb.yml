# ── Clinic B on the SAME Mac (rehearsal / fallback) ──────────────────────────
# Runs a second, fully independent MediLink clinic beside Clinic A:
#   Frontend :3010   Backend :8010   its own local Postgres (medilinkb_db)
# It shares the same RDS (CLOUD_DATABASE_URL) and IC key as Clinic A via
# backend/.env.clinicb, so records unify across the two clinics by IC.
#
# Start:  docker compose -p clinicb -f docker-compose.clinicb.yml up -d --build
# Stop:   docker compose -p clinicb -f docker-compose.clinicb.yml down
name: clinicb
services:
  dbb:
    image: postgres:16-alpine
    container_name: medilinkb_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medilink
      POSTGRES_USER: medilink
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdatab:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medilink"]
      interval: 10s
      timeout: 5s
      retries: 5

  backendb:
    build: ./backend
    container_name: medilinkb_api
    restart: unless-stopped
    env_file: ./backend/.env.clinicb
    volumes:
      - uploadsb:/app/uploads
    ports:
      - "8010:8000"
    depends_on:
      dbb:
        condition: service_healthy
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --workers 2 --reload

  frontendb:
    build: ./frontend
    container_name: medilinkb_web
    restart: unless-stopped
    environment:
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      REACT_APP_BACKEND_URL: "http://Yashhs-MacBook-Air.local:8010"
    ports:
      - "3010:3000"
    depends_on:
      - backendb

volumes:
  pgdatab:
  uploadsb:
