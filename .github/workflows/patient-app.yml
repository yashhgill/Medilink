# Builds the Pulih patient app for Android and iPhone.
# Android: an installable test APK and a release bundle (AAB) for the Play Store
#          (sign the AAB with the upload key in Play Console before publishing).
# iPhone:  a simulator build to prove the project compiles; App Store builds need
#          the owner's Apple Developer account and signing in Xcode.
name: Patient app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["patient-app/**", ".github/workflows/patient-app.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and sync
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
      - name: Build
        working-directory: patient-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/Pulih-Patient-26.1029.4-test.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../out/Pulih-Patient-26.1029.4-unsigned.aab
      - uses: actions/upload-artifact@v4
        with:
          name: patient-app-android
          path: out/*

  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: patient-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and sync
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios
      - name: Build for the iPhone simulator (no signing)
        working-directory: patient-app/ios/App
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p ../../../out
          cd build/Build/Products/Release-iphonesimulator && zip -qry ../../../../../../../out/Pulih-Patient-26.1029.4-iOS-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: patient-app-ios
          path: out/*

  # Attach the app builds to the draft release of the same version, beside the desktop apps.
  attach:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v26.1029.4
          name: Pulih v26.1029.4
          draft: true
          files: out/*
