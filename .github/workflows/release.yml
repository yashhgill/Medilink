# Builds the Pulih desktop app for every platform and publishes a release.
#
#   Tag a version:      git tag v1.1.0 && git push origin v1.1.0
#   Or run it by hand:  Actions → Release → Run workflow
#
# The website's download buttons point at releases/latest/download/<file>, so a
# new release is live on the site as soon as this finishes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the interface
        working-directory: frontend
        env:
          REACT_APP_KIOSK_TOKEN: demo-kiosk-token
          REACT_APP_BACKEND_URL: ""
          GENERATE_SOURCEMAP: "false"
          NODE_OPTIONS: --max-old-space-size=4096
          CI: "false"
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx craco build
      - uses: actions/upload-artifact@v4
        with:
          name: interface
          path: frontend/build

  desktop:
    needs: interface
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Pulih-Windows-x64.zip
          - os: macos-14
            asset: Pulih-macOS-AppleSilicon.zip
          - os: macos-15-intel
            asset: Pulih-macOS-Intel.zip
          - os: ubuntu-22.04
            asset: Pulih-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: interface
          path: backend/static
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "fastapi==0.110.1" "uvicorn[standard]==0.25.0" "databases[aiosqlite,asyncpg]==0.9.0" aiosqlite asyncpg psycopg2-binary "sqlalchemy>=2.0.43" "pydantic[email]>=2.12" python-dotenv "pyjwt>=2.10.1" "bcrypt==4.1.3" passlib python-multipart httpx "qrcode[pil]" Pillow fpdf2 cryptography groq tzdata
      - name: Freeze
        run: pyinstaller --noconfirm packaging/medilink.spec
      - name: Smoke test (the build starts a clinic and serves the interface)
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/home/data" LOCALAPPDATA="$RUNNER_TEMP/home/appdata"
          mkdir -p "$HOME"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/Pulih/Pulih.exe; else BIN=dist/Pulih/Pulih; fi
          "$BIN" --port 8421 > smoke.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8421/api/setup/status && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8421/kiosk | grep -q '<div id="root">'
          echo "build starts and serves the interface"
      - name: Package
        shell: bash
        run: |
          cp packaging/README-INSTALL.txt dist/Pulih/README.txt
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../${{ matrix.asset }}" Pulih >/dev/null
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent Pulih "../${{ matrix.asset }}"
          else
            tar czf "../${{ matrix.asset }}" Pulih
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Collect files and checksums
        run: |
          mkdir -p out
          find assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} out/ \;
          ls -la out
          test "$(ls out | wc -l)" -ge 4
          cd out && sha256sum Pulih-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Pulih ${{ github.event.inputs.version || github.ref_name }}
          draft: true          # downloads are by request: HarNova shares the files with approved clinics
          body: |
            Pulih desktop for clinics. Download the file for your computer, unzip it and open Pulih.
            First run opens a short set-up in your browser. Full guide: https://medilink.harnova.my/setup.html
          files: out/*
